name: Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-installer.yml"
      - "packaging/**"
      - "requirements.txt"
      - "*.py"
      - ".streamlit/**"
      - "frontend/**"

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Package app and Python
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Check packaged app
        shell: pwsh
        run: ./packaging/test-windows-package.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: IDS-Checker-Setup
          path: dist/IDS-Checker-Setup.exe

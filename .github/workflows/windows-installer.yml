name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - ".github/workflows/windows-installer.yml"
      - "packaging/**"
      - "requirements.txt"
      - "*.py"
      - ".streamlit/**"
      - "frontend/**"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Package app and Python
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Check packaged app
        shell: pwsh
        run: ./packaging/test-windows-package.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: IDS-Checker-Setup
          path: dist/IDS-Checker-Setup.exe
      - name: Publish tagged installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/IDS-Checker-Setup.exe --title "IDS Checker ${{ github.ref_name }}" --notes "Download and run IDS-Checker-Setup.exe. It installs the validator, adds a desktop shortcut, and opens the app in your browser."

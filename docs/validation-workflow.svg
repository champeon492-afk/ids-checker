<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">IDS Checker validation workflow</title>
  <desc id="description">An IDS requirement and an IFC model enter the validator. The results list passed and failed checks, show distinct elements beside a 3D model, and can be saved or exported. Example data only.</desc>
  <defs>
    <style>
      .bg{fill:#0a0c0b}.card{fill:#171a18;stroke:#3a433d;stroke-width:2}.muted{fill:#a8b2aa}.white{fill:#f6f8f5}.lime{fill:#baff16}.red{fill:#f47a79}.line{stroke:#baff16;stroke-width:3;fill:none;marker-end:url(#arrow)}
      text{font-family:Arial,Helvetica,sans-serif}.title{font-size:29px;font-weight:700}.section{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.tag{font-size:12px;font-weight:700;letter-spacing:1px}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#baff16"/></marker>
  </defs>
  <rect class="bg" width="1200" height="640"/>
  <text class="title white" x="40" y="48">How IDS Checker works</text>
  <text class="small muted" x="940" y="47">Illustrative example</text>

  <rect class="card" x="40" y="82" width="330" height="136" rx="12"/>
  <text class="tag lime" x="58" y="108">1  UPLOAD IDS FILES</text>
  <text class="section white" x="58" y="137">Information requirements</text>
  <text class="body muted" x="58" y="165">IfcWall needs FireRating</text>
  <text class="small muted" x="58" y="188">Pset_WallCommon.FireRating</text>

  <path class="line" d="M380 150 H412"/>
  <rect class="card" x="425" y="82" width="330" height="136" rx="12"/>
  <text class="tag lime" x="443" y="108">2  UPLOAD IFC MODEL</text>
  <text class="section white" x="443" y="137">Building elements</text>
  <text class="body muted" x="443" y="165">Wall W-01: FireRating = 60</text>
  <text class="body muted" x="443" y="188">Wall W-02: FireRating missing</text>

  <path class="line" d="M765 150 H797"/>
  <rect class="card" x="810" y="82" width="350" height="136" rx="12"/>
  <text class="tag lime" x="828" y="108">3  RUN VALIDATION</text>
  <text class="section white" x="828" y="137">Compare IDS with IFC</text>
  <text class="body muted" x="828" y="165">Find applicable model elements</text>
  <text class="body muted" x="828" y="188">Evaluate each information rule</text>

  <path class="line" d="M985 220 V245"/>
  <rect class="card" x="40" y="258" width="1120" height="68" rx="12"/>
  <text class="tag lime" x="58" y="283">4  READ THE RESULTS</text>
  <text class="body white" x="58" y="308">1 passed check</text>
  <text class="body red" x="300" y="308">1 failed check</text>
  <text class="body white" x="545" y="308">1 passed element</text>
  <text class="body white" x="805" y="308">1 failed element</text>

  <rect class="card" x="40" y="346" width="345" height="222" rx="12"/>
  <text class="tag lime" x="58" y="371">5  REVIEW ELEMENTS</text>
  <text class="section white" x="58" y="400">Validation results</text>
  <rect x="58" y="420" width="309" height="57" rx="8" fill="#342523"/>
  <text class="body red" x="72" y="443">Failed elements: 1</text>
  <text class="small white" x="72" y="464">W-02 · Missing FireRating</text>
  <rect x="58" y="485" width="309" height="57" rx="8" fill="#253018"/>
  <text class="body lime" x="72" y="508">Passed elements: 1</text>
  <text class="small white" x="72" y="529">W-01 · FireRating = 60</text>

  <rect class="card" x="403" y="346" width="757" height="222" rx="12"/>
  <text class="tag lime" x="421" y="371">6  INSPECT IN 3D</text>
  <text class="section white" x="421" y="400">IDS Model Viewer</text>
  <rect x="422" y="416" width="490" height="132" rx="8" fill="#809080"/>
  <path d="M488 493 L625 440 L790 483 L655 533 Z" fill="#b6c4b6" fill-opacity=".55" stroke="#e6eee5"/>
  <path d="M488 493 V452 L625 412 V440 Z" fill="#b6c4b6" fill-opacity=".4" stroke="#e6eee5"/>
  <path d="M625 440 V412 L790 453 V483 Z" fill="#b6c4b6" fill-opacity=".4" stroke="#e6eee5"/>
  <rect x="610" y="454" width="35" height="60" fill="#baff16" stroke="#0a0c0b" stroke-width="2"/>
  <text class="small white" x="683" y="531">W-02 highlighted</text>
  <rect x="927" y="416" width="215" height="132" rx="8" fill="#242b26"/>
  <text class="body white" x="943" y="443">IFC properties</text>
  <text class="small muted" x="943" y="468">IfcWall · W-02</text>
  <text class="small red" x="943" y="493">FireRating missing</text>
  <text class="small muted" x="943" y="522">Inspect · isolate · navigate</text>

  <text class="tag lime" x="40" y="606">7  SAVE OR SHARE</text>
  <text class="body white" x="210" y="606">Complete .idscheck project  ·  Issues CSV  ·  JSON  ·  HTML reports</text>
</svg>
